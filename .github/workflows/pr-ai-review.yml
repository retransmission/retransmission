name: AI review on request

# Posts a Claude code review of a pull request when a maintainer applies the
# `needs ai review` label, then removes the label; applying it again requests
# another round. Later rounds take the earlier ones into account: threads the
# review opened are resolved once their finding is fixed, and findings that an
# open thread already covers are not posted twice.
#
# Who may request one is gated twice: only collaborators can apply labels at
# all, and the applier must also appear in the AI_REVIEW_USERS repository
# variable, a JSON array of GitHub logins kept under Settings > Secrets and
# variables > Actions. The list mirrors the org's `contributors` and
# `maintainers` teams by hand: a workflow's default token cannot read team
# membership, so update the variable when those teams change. The action
# adds a check of its own, refusing actors without write access.

on:
  # `pull_request_target` (rather than `pull_request`) so the job has the
  # repository's secrets even when the PR comes from a fork. The job therefore
  # reads PR-supplied files while holding the Claude token, which is why only
  # trusted maintainers can request a review. Nothing from the PR is executed:
  # the action restores CLAUDE.md and .claude/ from the base branch before
  # Claude starts, and Claude's shell access is limited to the commands listed
  # below.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  # The action authenticates as the Claude GitHub App through OIDC, and the
  # review comments appear under that app's name.
  id-token: write

# A new request supersedes a review still in progress on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'needs ai review' &&
      contains(fromJSON(vars.AI_REVIEW_USERS || '[]'), github.event.sender.login)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that carried the label, so the review reads the files
          # it comments on. Full history lets it consult `git log` and
          # `git blame`.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # actions/checkout refuses fork code under `pull_request_target`
          # without this opt-in. The safeguards described at the top of the
          # file are what make it acceptable here.
          allow-unsafe-pr-checkout: true

      # Review threads are reachable only through GraphQL, and `gh api graphql`
      # would let the review run any query or mutation. This helper exposes
      # the two calls it needs instead. It lives outside the checkout so the
      # PR cannot alter it.
      - name: Install the review-thread helper
        run: |
          mkdir -p "$RUNNER_TEMP/ai-review"
          echo "$RUNNER_TEMP/ai-review" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/ai-review/pr-review-threads" <<'EOF'
          #!/bin/sh
          # pr-review-threads list <pr>          unresolved review threads, one JSON object per line
          # pr-review-threads resolve <thread>   mark a thread resolved
          set -eu
          usage() { echo 'usage: pr-review-threads list <pr> | resolve <thread-id>' >&2; exit 2; }
          case "${1-}" in
            list)
              case "${2-}" in ''|*[!0-9]*) usage ;; esac
              gh api graphql -F pr="$2" -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -f query='
                query($owner: String!, $repo: String!, $pr: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      reviewThreads(first: 100) {
                        nodes {
                          id isResolved isOutdated path line
                          comments(first: 50) { nodes { author { login } body } }
                        }
                      }
                    }
                  }
                }' --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not)'
              ;;
            resolve)
              case "${2-}" in ''|*[!A-Za-z0-9_=-]*) usage ;; esac
              gh api graphql -F id="$2" -f query='
                mutation($id: ID!) {
                  resolveReviewThread(input: {threadId: $id}) { thread { isResolved } }
                }' --jq '.data.resolveReviewThread.thread'
              ;;
            *) usage ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/ai-review/pr-review-threads"

      - uses: anthropics/claude-code-action@v1
        with:
          # A long-lived token from `claude setup-token`; runs are billed to
          # that account's Claude subscription rather than to an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude Code's bundled review skill. Its level sets how many
          # findings it reports; `--comment` posts each one as an inline PR
          # comment.
          prompt: /code-review xhigh --comment ${{ github.event.pull_request.number }}
          # `--effort` sets the model's reasoning depth, separately from the
          # skill's level above. The inline-comment MCP server starts only when
          # `--allowedTools` names it.
          claude_args: |
            --model claude-opus-5-5
            --effort xhigh
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(pr-review-threads:*)"
            --append-system-prompt "Earlier rounds of this same automated review may already have left inline comments on the pull request, posted by the Claude GitHub App (author login claude). Before posting anything, run pr-review-threads list <pr number> to see the unresolved review threads. For each thread the app opened: if the current code no longer has the problem, resolve it with pr-review-threads resolve <thread id>; if the problem remains, leave the thread as it is and do not post the finding again. Never resolve a thread a person opened. Post only findings that no open thread already covers. Finish with one gh pr comment that says what this round resolved, left open, and added, so a request always leaves a visible result."

      - name: Remove the label
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: context.payload.pull_request.number,
                name: context.payload.label.name,
              });
            } catch (error) {
              // 404 just means the label was already gone; anything else is real.
              if (error.status !== 404) throw error;
            }
