name: AI review on request

# Posts a Claude code review of a pull request when a maintainer applies the
# `needs ai review` label, then removes the label; applying it again requests
# another round. Later rounds take the earlier ones into account: threads the
# review opened are resolved once their finding is fixed, and findings that an
# open thread already covers are not posted twice.
#
# Who may request one is gated twice: only collaborators can apply labels at
# all, and the applier must also appear in the AI_REVIEW_USERS repository
# variable, a JSON array of GitHub logins kept under Settings > Secrets and
# variables > Actions. The list mirrors the org's `contributors` and
# `maintainers` teams by hand: a workflow's default token cannot read team
# membership, so update the variable when those teams change. The same list
# is handed to the action, which otherwise refuses actors without write
# access; the contributors team has triage, which can label but not write.

on:
  # `pull_request_target` (rather than `pull_request`) so the job has the
  # repository's secrets even when the PR comes from a fork. The job therefore
  # reads PR-supplied files while holding the Claude token, which is why only
  # trusted maintainers can request a review. Nothing from the PR is executed:
  # the action restores CLAUDE.md and .claude/ from the base branch before
  # Claude starts, and Claude's shell access is limited to the commands listed
  # below.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

# A new request supersedes a review still in progress on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'needs ai review' &&
      contains(fromJSON(vars.AI_REVIEW_USERS || '[]'), github.event.sender.login)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      resolve-ids: ${{ steps.queued.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that carried the label, so the review reads the files
          # it comments on. Full history lets it consult `git log` and
          # `git blame`.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # actions/checkout refuses fork code under `pull_request_target`
          # without this opt-in. The safeguards described at the top of the
          # file are what make it acceptable here.
          allow-unsafe-pr-checkout: true

      # Review threads are reachable only through GraphQL, and `gh api graphql`
      # would let the review run any query or mutation. This helper exposes
      # the two calls it needs instead. It lives outside the checkout so the
      # PR cannot alter it.
      - name: Install the review-thread helper
        run: |
          mkdir -p "$RUNNER_TEMP/ai-review"
          echo "$RUNNER_TEMP/ai-review" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/ai-review/pr-review-threads" <<'EOF'
          #!/bin/sh
          # pr-review-threads list <pr>               unresolved review threads, one JSON object per line
          # pr-review-threads reply <pr> <comment>    reply in a thread; the reply text comes from stdin
          # pr-review-threads resolve <thread>        queue a thread to be marked resolved
          set -eu
          usage() { echo 'usage: pr-review-threads list <pr> | reply <pr> <comment-id> | resolve <thread-id>' >&2; exit 2; }
          case "${1-}" in
            list)
              case "${2-}" in ''|*[!0-9]*) usage ;; esac
              gh api graphql -F pr="$2" -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -f query='
                query($owner: String!, $repo: String!, $pr: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      reviewThreads(first: 100) {
                        nodes {
                          id isResolved isOutdated path line
                          comments(first: 50) { nodes { databaseId author { login } body } }
                        }
                      }
                    }
                  }
                }' --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not)'
              ;;
            reply)
              case "${2-}" in ''|*[!0-9]*) usage ;; esac
              case "${3-}" in ''|*[!0-9]*) usage ;; esac
              gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$2/comments/$3/replies" -f body="$(cat)" --jq '{id, html_url}'
              ;;
            resolve)
              # Resolving needs a permission this job does not hold, so the id
              # is queued for the finish-round job. The review's subprocess
              # sandbox leaves little writable besides the checkout, so the
              # queue goes to the first of these that accepts it.
              case "${2-}" in PRRT_*) ;; *) usage ;; esac
              case "${2-}" in *[!A-Za-z0-9_=-]*) usage ;; esac
              for q in "${GITHUB_WORKSPACE:-$PWD}/ai-review-resolve-ids" "$HOME/ai-review-resolve-ids" "$(dirname "$0")/resolve-ids"; do
                if { echo "$2" >> "$q"; } 2>/dev/null; then
                  echo "queued: $2 will be marked resolved once this review finishes"
                  exit 0
                fi
              done
              echo "could not queue $2: no writable location" >&2
              exit 1
              ;;
            *) usage ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/ai-review/pr-review-threads"

      - uses: anthropics/claude-code-action@v1
        with:
          # A long-lived token from `claude setup-token`; runs are billed to
          # that account's Claude subscription rather than to an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own token, so comments come from github-actions[bot].
          # The action would otherwise post as the Claude GitHub App, but its
          # token exchange rejects `pull_request_target` runs
          # (anthropics/claude-code-action#713).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The whitelist again, as the comma-separated form the action wants.
          # Naming non-write users also makes the action scrub secrets from
          # Claude's subprocesses and sandbox them, which costs nothing here.
          allowed_non_write_users: ${{ join(fromJSON(vars.AI_REVIEW_USERS || '[]'), ',') }}
          # Lists Claude's tool calls on the run's summary page, which is the
          # only record of whether the earlier-rounds steps happened.
          display_report: 'true'
          # The prompt drives the round itself and runs Claude Code's bundled
          # review skill for the findings. Starting the prompt with
          # `/code-review` instead would hand the whole run to that skill,
          # which follows only its own procedure: it posts every finding as
          # an inline comment and never sees the steps below.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of this repository as the automated Claude review that a maintainer requested with the "needs ai review" label. Work in four steps.

            1. Run `pr-review-threads list ${{ github.event.pull_request.number }}`. It prints the unresolved review threads, one JSON object per line, with each comment's author login and id. Threads whose first comment is by `github-actions` are this review's own earlier rounds; the others were opened by people. `gh pr view ${{ github.event.pull_request.number }}` tells you who the author is, and `gh pr view ${{ github.event.pull_request.number }} --comments` shows the summaries earlier rounds posted.

            2. Invoke the `code-review` skill with the arguments `high ${{ github.event.pull_request.number }}` and wait for its findings. Do not pass `--comment`; step 3 posts the findings.

            3. Decide what to post. Keep a finding only if this PR introduces the problem or makes it worse; a problem that already existed in code the PR merely touches or moves is a follow-up idea, not a finding. Skip findings about the PR description, release notes, labels, or commit message wording; maintainers handle those. In a round after the first, raise a new finding only in code that changed since the previous round, unless it is a bug. A finding that an open thread already covers, whoever opened it, gets no new comment; if you have something new to add there, reply in that thread with `pr-review-threads reply ${{ github.event.pull_request.number }} <comment id>`, giving the reply text on standard input. Post each remaining finding as an inline comment with `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`. Prefer a committable suggestion block whenever one fixes the issue entirely; otherwise describe the fix. Write comment text as short, direct, actionable sentences about the code, never about what the author or readers know. Before posting a suggestion, check what else it entails: search the PR's files for the symbols it touches, the comments that mention them, and the lines it leaves redundant, and put those edits in the same suggestion, so applying it does not earn a new finding next round. A suggestion must not change behavior unless it fixes a bug the PR introduced or made worse, and it must stay within what the PR sets out to do; a larger change the PR makes possible is a follow-up idea. A later round never raises a consequence of a change this review suggested as a new finding; it replies in that thread instead.

            Then settle this review's own earlier threads with `pr-review-threads resolve <thread id>`: queue a thread when the current code no longer has the problem, and also when the latest reply from the PR author or from one of the maintainers and contributors (${{ join(fromJSON(vars.AI_REVIEW_USERS || '[]'), ', ') }}) declines it as out of scope, deferred, or disagreed with. That is their call, and a maintainer can reopen the thread. Never resolve a thread a person opened.

            4. Post one short comment with `gh pr comment ${{ github.event.pull_request.number }}`. Its first line must be exactly `<!-- ai-review-summary -->`, which a later job uses to hide this summary once a newer one exists. Then: a line saying this is the automated Claude review requested with the "needs ai review" label; one line of counts (fixed, declined, unresolved, new); an "Unresolved" list, left visible, with one line per thread still open after this round, each linking to the thread, the ones this round opened marked new; the threads fixed or closed this round, one line each with a link, inside a collapsed `<details>` block whose `<summary>` gives their count; and the follow-up ideas from step 3 that no earlier summary already lists, inside a second collapsed `<details>` block titled "Follow-up ideas, not for this PR". Keep every item to one line; the threads hold the detail.
          # `--effort` sets the model's reasoning depth. The skill's level
          # above is separate: `high` hunts bugs and verifies each candidate
          # with a fresh agent; `xhigh` would add cleanup hunts (reuse,
          # naming, conventions) on top. The inline-comment MCP server starts
          # only when `--allowedTools` names it.
          claude_args: |
            --model claude-opus-5-5
            --effort xhigh
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(pr-review-threads:*)"

      - name: Hand the queued thread ids to the finish-round job
        id: queued
        run: |
          ids=$(cat "$GITHUB_WORKSPACE/ai-review-resolve-ids" "$HOME/ai-review-resolve-ids" "$RUNNER_TEMP/ai-review/resolve-ids" 2>/dev/null | sort -u | tr '\n' ' ')
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Remove the label
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: context.payload.pull_request.number,
                name: context.payload.label.name,
              });
            } catch (error) {
              // 404 just means the label was already gone; anything else is real.
              if (error.status !== 404) throw error;
            }

  # Marking a review thread resolved needs `contents: write`, GitHub's rule
  # rather than ours. This job is the only one that holds it: no checkout, no
  # PR content, no Claude. It resolves the threads the review queued and
  # hides the summaries of earlier rounds as outdated.
  finish-round:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Resolve the threads the review queued
        if: needs.review.outputs.resolve-ids != ''
        env:
          IDS: ${{ needs.review.outputs.resolve-ids }}
        run: |
          for id in $IDS; do
            case "$id" in PRRT_*) ;; *) echo "::warning::Skipping unexpected thread id $id"; continue ;; esac
            gh api graphql -F id="$id" -f query='
              mutation($id: ID!) {
                resolveReviewThread(input: {threadId: $id}) { thread { isResolved } }
              }' --jq '.data.resolveReviewThread.thread.isResolved' | sed "s/^/$id resolved=/"
          done

      - name: Hide the summaries of earlier rounds
        run: |
          # Every summary but the newest, matched by the marker line the
          # review puts first.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ai-review-summary -->")))] | .[:-1][] | .node_id' |
          while read -r id; do
            gh api graphql -F id="$id" -f query='
              mutation($id: ID!) {
                minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } }
              }' --jq '.data.minimizeComment.minimizedComment.isMinimized' | sed "s/^/$id hidden=/" ||
              echo "::warning::Could not hide earlier summary $id"
          done
